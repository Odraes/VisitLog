{% extends "base.html" %}
{% block content %}


    <div class="form-box active" id="form-box">
        <form action="{{ url_for('owner') }}" method="POST" enctype="multipart/form-data" novalidate>
        <h2>Add Visitor Info</h2>
        <label for="name"></label><input type="text" name="name" id="name" placeholder="name" required>
        <label for="contact"></label><input type="text" name="contact" id="contact" placeholder="contact" required>
        <label for="purpose"></label><input type="text" name="purpose" id="purpose" placeholder="purpose of visit" required>
        <label for="id_image"></label><input type="file" name="id_image" id="id_image" accept="image/*">
        <button type="submit">Submit to Generate code</button>
        </form>
    </div>

    <div class="form-box" id="form-box">
    <h2>Visitor Registered</h2>

    <p>Give this code to your visitor:</p>

    <h1>{{ code }}</h1>

    </div>



{% endblock %}
