{% extends "base.html" %}
{% block content %}

    <div class="form-box active" id="form-box">

        <h2>Visitor Registered Successfully!</h2>

        {% if visitor %}
            <div class="visitor-card" style="border: 1px solid #ccc; padding: 20px; margin-bottom: 20px;">
                <p><strong>Name:</strong> {{ visitor.name }}</p>
                <p><strong>Contact:</strong> {{ visitor.contact }}</p>
                <p><strong>Purpose:</strong> {{ visitor.purpose }}</p>
                <p><strong>Status:</strong> {{ visitor.status }}</p>

                <hr>
                <p><small><strong>Secret Code:</strong> <span id="visitor-code">{{ visitor.visitor_code }}</span></small></p>

                <!-- This empty div is exactly where we will put the QR Code image! -->
                <div id="qrcode"></div>
            </div>
        {% endif %}

        <br>
        <a href="{{ url_for('owner') }}">
            <button class="header-btn" style="margin-right: 10px; margin-bottom: 5px;">Register Another</button>
        </a>

    </div>

{% endblock %}
