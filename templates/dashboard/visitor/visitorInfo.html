{% extends "base.html" %}
{% block content %}

    <div class="form-box active" id="form-box">
        <h2>Visitor Registered Successfully!</h2>

        {% if visitor %}
            <div class="visitor-card" style="border: 1px solid #ccc; padding: 20px; margin-bottom: 20px; text-align: center;">
                <p><strong>Name:</strong> {{ visitor.name }}</p>
                <p><strong>Contact:</strong> {{ visitor.contact }}</p>
                <p><strong>Purpose:</strong> {{ visitor.purpose }}</p>

                {% if visitor.id_image %}
                    <div style="margin-top:10px;">
                        <strong>ID Image:</strong><br>
                        <img src="{{ url_for('static', filename='uploads/' ~ visitor.id_image) }}" alt="Visitor ID" style="max-width:200px; border:1px solid #ccc; margin-top:8px;"/>
                    </div>
                {% endif %}

                <hr>
                <!-- This empty div is where the QR code will appear -->
                <div id="qrcode" style="margin: 20px auto; display: flex; justify-content: center;"></div>

                <p><small><strong>Code:</strong> {{ visitor.visitor_code }}</small></p>
            </div>
        {% endif %}

        <br>
        <a href="{{ url_for('owner') }}">
            <button class="header-btn" style="margin-right: 10px;">Register Another</button>
        </a>
    </div>

    <!-- 1. Load the QR Code library from the CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- 2. Generate the QR Code -->
    <script>
        // Check if the div exists on the page
        const qrContainer = document.getElementById("qrcode");

        if (qrContainer) {
            // Jinja injects the Python string directly into this JavaScript variable!
            const secretCode = "{{ visitor.visitor_code }}";

            // Draw the QR code inside the container
            new QRCode(qrContainer, {
                text: secretCode,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>

{% endblock %}
